<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<!-- MathJax 完整配置（匹配 Typora 渲染效果） -->
<script>
  MathJax = {
    tex: {
      // 公式界定符（支持 Typora 常用格式）
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$','$$'], ['\\[','\\]']],
      // 启用扩展包（与 Typora 保持一致）
      packages: {
        '[+]': [
          'ams',           // AMS 数学符号
          'amscd',         // 交换图
          'boldsymbol',    // 粗体数学符号
          'braket',        // 狄拉克符号 \bra, \ket
          'cancel',        // 删除线 \cancel
          'enclose',       // 包围符号 \enclose
          'extpfeil',      // 扩展箭头
          'mathtools',     // 高级数学工具（\coloneq 等）
          'physics',       // 物理宏包（\div, \qty, \abs 等）
          'textcomp',      // 文本符号
          'unicode'        // Unicode 字符支持（空集等）
        ]
      },
      // 物理包配置（允许重定义 \div 等命令）
      physics: {
        italicdiff: false,    // 微分符号用正体
        arrowdel: false
      },
      // 宏定义（补充常用命令）
      macros: {
        // 确保竖线相关命令可用
        abs: ['\\lvert #1 \\rvert', 1],
        norm: ['\\lVert #1 \\rVert', 1],
        // 集合相关
        set: ['\\{ #1 \\}', 1],
        emptyset: '\\varnothing',     // 空集替代命令
        // 微分符号
        dd: ['\\mathrm{d}#1', 1],
        // 期望、概率
        E: ['\\mathbb{E}'],
        P: ['\\mathbb{P}']
      }
    },
    // 输出格式（使用 HTML+SVG 混合输出，兼容性最好）
    options: {
      ignoreHtmlClass: 'tex2jax_ignore',
      processHtmlClass: 'tex2jax_process'
    },
    // 加载器配置（确保扩展正确加载）
    loader: {
      load: ['[tex]/physics', '[tex]/mathtools', '[tex]/unicode']
    },
    // 启动配置
    startup: {
      typeset: false,
      pageReady: () => {
        return MathJax.startup.defaultPageReady();
      }
    }
  };
</script>
<script 
  type="text/javascript" 
  id="MathJax-script" 
  async 
  src="https://cdn.bootcdn.net/ajax/libs/mathjax/3.2.2/es5/tex-chtml.js">
</script>
