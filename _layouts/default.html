<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<!-- MathJax 稳定配置（支持 | 符号、空集等） -->
<script>
  MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$','$$'], ['\\[','\\]']],
      // 按需加载扩展包（更可靠）
      packages: ['base', 'ams', 'mathtools', 'unicode'],
      // 自定义宏，解决 | 和空集渲染问题
      macros: {
        // 绝对值：|x| 的 LaTeX 形式，避免 Markdown 干扰
        abs: ['\\lvert #1 \\rvert', 1],
        norm: ['\\lVert #1 \\rVert', 1],
        // 空集：提供两种形式
        emptyset: '\\varnothing',
        // 微分符号 d 正体
        dd: ['\\mathrm{d}#1', 1],
        // 常用集合
        R: '\\mathbb{R}',
        N: '\\mathbb{N}',
        Z: '\\mathbb{Z}',
        Q: '\\mathbb{Q}',
        C: '\\mathbb{C}'
      }
    },
    options: {
      ignoreHtmlClass: 'tex2jax_ignore',
      processHtmlClass: 'tex2jax_process'
    },
    loader: {
      // 显式加载所需扩展（确保 mathtools 等可用）
      load: ['[tex]/mathtools', '[tex]/unicode']
    }
  };
</script>
<script 
  type="text/javascript" 
  id="MathJax-script" 
  async 
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js">
</script>
